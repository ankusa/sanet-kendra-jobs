name: Update jobs and publish Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1,7,13 * * *'
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect public job headlines
        run: npm run update-jobs
      - run: npm run build
      - name: Save refreshed index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/jobs.json
          git diff --cached --quiet || git commit -m "Update job index [skip ci]"
          git push
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/client
